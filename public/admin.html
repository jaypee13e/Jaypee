<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Review panel</title>
<style>
:root{--bg:#04070d;--fg:#e6f4ff;--mut:#7f93b0;--ac:#39e0ff;--ac2:#7a8cff;--gl:rgba(8,14,28,.85);--bd:rgba(80,200,255,.22);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;padding:max(20px,env(safe-area-inset-top)) 16px 60px;background:var(--bg);color:var(--fg);font:16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:820px;margin:0 auto}
h1{margin:0 0 4px;font-size:clamp(24px,5vw,34px);line-height:1.15}
.mut{color:var(--mut);font-size:14px}
.glass{padding:18px;margin-bottom:12px;border:1px solid var(--bd);border-radius:16px;background:var(--gl)}
input{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:rgba(255,255,255,.06);color:var(--fg);font:inherit;font-size:16px}
.btn{padding:10px 18px;border:0;border-radius:99px;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#04101c;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;border:1px solid var(--bd);color:var(--fg)}
.btn.bad{background:transparent;border:1px solid #ff8a70;color:#ff8a70}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;margin:18px 0 14px;flex-wrap:wrap}
.tabs button{padding:10px 16px;border:1px solid var(--bd);border-radius:99px;background:var(--gl);color:var(--mut);font:inherit;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--ac);color:#04101c;border-color:var(--ac)}
.stars{color:var(--ac);letter-spacing:2px}
q{display:block;margin:6px 0;color:#c3d0ee;quotes:none;white-space:pre-wrap;overflow-wrap:anywhere}
.err{color:#ff8a70;min-height:1.4em;font-size:14px;margin:8px 0 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>Review panel</h1>
  <p class="mut">Private page. Only you can approve or delete reviews.</p>

  <div id="login" class="glass">
    <label class="mut" for="tk">Admin password</label>
    <input id="tk" type="password" autocomplete="current-password">
    <div class="row"><button class="btn" id="go">Sign in</button></div>
    <p class="err" id="err" role="status"></p>
  </div>

  <div id="panel" hidden>
    <div class="top">
      <span class="mut" id="sum"></span>
      <span><button class="btn alt" id="ref">Refresh</button> <button class="btn alt" id="out">Sign out</button></span>
    </div>
    <div class="tabs">
      <button class="on" data-t="pending">Pending</button>
      <button data-t="approved">Published</button>
    </div>
    <div id="list"></div>
  </div>
</div>
<script src="/admin.js"></script>
</body>
</html>
